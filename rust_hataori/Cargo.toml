[package]
name = "poisson_hataori"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hataori = { git = "https://github.com/shinaoka/hataori-rs", features = ["rayon"] }
tenferro-runtime = "0.3"
tenferro-cpu = "0.3"
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend",
    "bitmap_encoder",
    "surface_series",
    "ttf",
] }
